version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: algodesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algodesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algodesk_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-algodesk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algodesk} -d ${POSTGRES_DB:-algodesk}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: algodesk-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algodesk-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./strategies_user:/app/strategies_user
      - ./configs:/app/configs
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "src.algodesk.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algodesk-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./strategies_user:/app/strategies_user
      - ./configs:/app/configs
    command: ["python", "-m", "src.algodesk.ops.scheduler"]

  ticker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algodesk-ticker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: ["python", "-m", "src.algodesk.data.tick_ingester"]

  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algodesk-ai-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: ["python", "-m", "src.algodesk.ai.worker"]

  caddy:
    image: caddy:2-alpine
    container_name: algodesk-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
