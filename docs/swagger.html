<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NIFTY 500 Quantitative Prediction Engine - Swagger UI</title>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/favicon-16x16.png" sizes="16x16" />
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #0b0e17;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    /* Dark Theme Customization for Swagger UI */
    .topbar {
      display: none;
    }
    .swagger-ui {
      max-width: 1300px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    .swagger-ui .info {
      margin: 20px 0;
    }
    .swagger-ui .info .title {
      color: #00e5ff !important;
      font-size: 32px;
      font-weight: 700;
    }
    .swagger-ui .info p, .swagger-ui .info li, .swagger-ui .info table {
      color: #b0bec5 !important;
      line-height: 1.6;
    }
    .swagger-ui .info h1, .swagger-ui .info h2, .swagger-ui .info h3 {
      color: #ffffff !important;
    }
    .swagger-ui .scheme-container {
      background: #111625;
      box-shadow: none;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 15px 20px;
      margin-bottom: 24px;
    }
    .swagger-ui .opblock {
      background: #111625;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 14px;
    }
    .swagger-ui .opblock .opblock-summary {
      padding: 12px 18px;
    }
    .swagger-ui .opblock.opblock-get {
      border-color: rgba(97, 175, 254, 0.3);
      background: rgba(97, 175, 254, 0.05);
    }
    .swagger-ui .opblock.opblock-post {
      border-color: rgba(73, 204, 144, 0.3);
      background: rgba(73, 204, 144, 0.05);
    }
    .swagger-ui .opblock-tag {
      color: #ffffff !important;
      font-size: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 0 8px 0;
      margin-top: 30px;
    }
    .swagger-ui .opblock-tag small {
      color: #90a4ae !important;
    }
    .swagger-ui .opblock .opblock-summary-path,
    .swagger-ui .opblock .opblock-summary-path__deprecated {
      color: #eceff1 !important;
      font-weight: 600;
    }
    .swagger-ui .opblock .opblock-summary-description {
      color: #90a4ae !important;
    }
    .swagger-ui table thead tr th {
      color: #cfd8dc !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .swagger-ui .parameter__name {
      color: #80d8ff !important;
      font-weight: 600;
    }
    .swagger-ui .parameter__type {
      color: #b388ff !important;
    }
    .swagger-ui .btn.execute {
      background-color: #00e5ff;
      color: #07090e;
      border-color: #00e5ff;
      font-weight: 700;
      border-radius: 6px;
    }
    .swagger-ui .btn.execute:hover {
      background-color: #1de9b6;
    }
    .swagger-ui .model-box {
      background: #0d111c;
      border-radius: 6px;
      padding: 12px;
    }
    .swagger-ui section.models {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: #111625;
    }
    .swagger-ui section.models h4 {
      color: #eceff1;
    }
    .swagger-ui select {
      background: #0d111c;
      color: #eceff1;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .header-nav {
      background: #07090e;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-nav a {
      color: #00e5ff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .header-nav a:hover {
      text-decoration: underline;
    }
    .pill {
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      color: #00e5ff;
    }
  </style>
</head>
<body>
  <div class="header-nav">
    <div style="display:flex; align-items:center; gap: 12px;">
      <a href="/" target="_blank">&larr; Return to Live Terminal Dashboard</a>
      <span class="pill">NIFTY 500 Universe</span>
      <span class="pill">OpenAPI 3.1</span>
    </div>
    <div style="display:flex; gap: 12px;">
      <a href="/openapi.json" target="_blank" download="openapi.json">&#128190; Download openapi.json</a>
      <a href="/redoc" target="_blank">&#128214; View in ReDoc</a>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      // Initialize Swagger UI pointing to /openapi.json or embedded fallback
      window.ui = SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout",
        docExpansion: "list",
        filter: true,
        tryItOutEnabled: true,
        displayRequestDuration: true
      });
    };
  </script>
</body>
</html>
